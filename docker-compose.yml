version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: phong_tro_vn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 2004
      POSTGRES_DB: phong_tro_vn
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: phong_tro_vn_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  postgres_data:
